<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND++ Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-body min-vh-100 d-flex flex-column">

    <div id="header-placeholder"></div>

    <main class="flex-fill d-flex">
        <div class="row flex-fill g-0">

            <div id="main-content" class="col-lg-8 offset-lg-2 p-3 p-lg-4">
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Recent Campaigns</h5>
                        <button class="btn">
                            <i class="bi bi-plus-lg fw-bold"></i>
                        </button>
                    </div>
                    <div class="list-group list-group-flush">

                        <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action clickable-item"
                            href="campaign_page.html" data-name="Scorn of Scolia" data-system="System">
                            <span class="fs-5">Scorn of Scolia</span>
                            <span class="fs-6">System</span>
                        </a>

                        <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action clickable-item"
                            href="#" data-name="Campaign 2" data-system="System">
                            <span class="fs-5">Campaign 2</span>
                            <span class="fs-6">System</span>
                        </a>

                        <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action clickable-item"
                            href="#" data-name="Campaign 3" data-system="System">
                            <span class="fs-5">Campaign 3</span>
                            <span class="fs-6">System</span>
                        </a>
                    </div>
                </div>
            </div>

            <div id="sidebar" class="col-lg-4 d-none bg-light p-4 border-start border-dark">
                <h4 id="sidebar-title">Character Details</h4>
                <p id="sidebar-content">Click a character to see their details here.</p>
                <button id="close-sidebar-btn" class="btn btn-danger">Close</button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="../static/js/header_script.js"></script>
    <script src="../static/js/sidebar_script.js"></script>
</body>

</html>
