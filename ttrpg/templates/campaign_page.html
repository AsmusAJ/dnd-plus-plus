{% extends "base.html" %}

{% block title %}DND++ Dashboard{% endblock %}

{% block content %}
<main class="flex-fill">
    <div class="row justify-content-center">
        <div class="col-lg-8 align-items-center">
            <h2 class="mb-0 text-center p-4">{{ page_title }}</h2>
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Recent Campaigns</h5>
                    <button class="btn">
                        <i class="bi bi-plus-lg fw-bold"></i>
                    </button>
                </div>
                <div class="list-group list-group-flush">

                    {% for session in sessions %}
                    <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action"
                        href="{}">
                        <span class="fs-5">{{ session.date }}</span>
                        <span class="fs-6"></span>
                    </a>
                    {% else %}
                    <div class="card-body text-center p-4">
                        <p class="mb-0 fs-5">No recent campaigns.</p>
                    </div>
                    {% endfor %}

                </div>
            </div>
        </div>
</main>

<script src="../static/js/sidebar_script.js"></script>
{% endblock %}
