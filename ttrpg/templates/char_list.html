<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND++ Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="bg-body min-vh-100"> <!-- makes background color-->
        <div id="header-placeholder"></div>

        <main class="container-fluid p-3 p-lg-4">
            <div class="row">
                <div class="col-lg-2"></div> <!--Left padding-->
                <div class="col-lg-8">
                    {% for character in characters %}
                    <div class="card mb-4">
                        <div class="list-group list-group-flush">
                            <a class="nav-link d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action"
                                href="#">
                                <strong class="fs-5">{{ character.page_title }}</strong>
                                <span class="fs-6">System TEMP</span>
                            </a>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <div class="col-lg-2"></div> <!--Right padding-->
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
