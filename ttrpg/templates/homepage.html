<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND++ Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- TODO MAKE THIS USE URL_FOR -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-purple shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">DND++</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Campaigns</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Characters</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link fs-5" href="#">
                            <i class="bi bi-gear-fill"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid p-3 p-lg-4">
        <div class="row">

            <div class="col-lg-4">

                <div class="card bg-white mb-4">
                    <div class="card-body">
                        <img src="https://via.placeholder.com/600x520.png?text=Calendar+Placeholder" class="img-fluid"
                            alt="Calendar Placeholder">
                    </div>
                </div>

                <div class="card custom-card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Upcoming Sessions</h5>
                    </div>
                    <div class="card-body p-3">
                        <div class="session-item d-flex justify-content-between align-items-center p-3 mb-2">
                            <strong class="fs-5">Session 1</strong>
                            <span class="fs-6">2 PM</span>
                            <div class="text-end lh-sm">
                                <small class="d-block">Oct 27,</small>
                                <small class="d-block">2025</small>
                            </div>
                        </div>
                        <div class="session-item d-flex justify-content-between align-items-center p-3">
                            <strong class="fs-5">Session 2</strong>
                            <span class="fs-6">3 PM</span>
                            <div class="text-end lh-sm">
                                <small class="d-block">Oct 31,</small>
                                <small class="d-block">2025</small>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-lg-8">

                <div class="card custom-card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-uppercase">Recent Campaigns</h5>
                        <button class="btn btn-icon">
                            <i class="bi bi-plus-lg fw-bold"></i>
                        </button>
                    </div>
                    <div class="card-body p-3">
                        <div class="list-item p-3 mb-2 fs-5">
                            <strong>Scorn of Scolia</strong>
                        </div>
                        <div class="list-item p-3 mb-2 fs-5">
                            Campaign Name
                        </div>
                        <div class="list-item p-3 fs-5">
                            Campaign Name
                        </div>
                    </div>
                </div>

                <div class="card custom-card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-uppercase">Recent Characters</h5>
                        <button class="btn btn-icon">
                            <i class="bi bi-plus-lg fw-bold"></i>
                        </button>
                    </div>
                    <div class="card-body p-3">
                        <div class="list-item p-3 mb-2 fs-5">
                            <strong>Adaine Amberheart</strong>
                        </div>
                        <div class="list-item p-3 mb-2 fs-5">
                            Character Name
                        </div>
                        <div class="list-item p-3 fs-5">
                            Character Name
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
