<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND++ Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="bg-body min-vh-100"> <!-- makes background color-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container-fluid"> <!--BS: makes this container full screen-->
                <a class="navbar-brand fw-bold" href="homepage.html">DND++</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Campaigns</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="char_list.html">Characters</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="#">
                                <i class="bi bi-gear-fill"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container-fluid p-3 p-lg-4">
            <div class="row">

                <div class="col-lg-4"> <!--left column, takes 4 of total columns-->

                    <div class="card bg-white mb-4">
                        <div class="card-body">
                            <img src="https://via.placeholder.com/600x520.png?text=Calendar+Placeholder"
                                class="img-fluid" alt="Calendar Placeholder">
                        </div>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Upcoming Sessions</h5>
                            <button class="btn btn-icon">
                                <i class="bi bi-plus-lg fw-bold"></i>
                            </button>
                        </div>
                        <div class="list-group list-group-flush">
                            <li
                                class="d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action">
                                <strong class="fs-5">Session 1</strong>
                                <div>
                                    <span class="fs-6">2 PM</span>
                                    <small>Oct 27,</small>
                                    <small>2025</small>
                                </div>
                            </li>
                            <li
                                class="d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action">
                                <strong class=" fs-5">Session 2</strong>
                                <div>
                                    <span class="fs-6">3 PM</span>
                                    <small>Oct 31,</small>
                                    <small>2025</small>
                            </li>
                        </div>
                    </div>

                </div>

                <div class="col-lg-8"> <!--rightcolumn, takes 8 of total columns-->

                    <div class="card custom-card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Recent Campaigns</h5>
                            <button class="btn btn-icon">
                                <i class="bi bi-plus-lg fw-bold"></i>
                            </button>
                        </div>
                        <div class="list-group list-group-flush">
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Scorn of Scolia
                            </li>
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Campaign Name
                            </li>
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Campaign Name
                            </li>
                        </div>
                    </div>

                    <div class="card custom-card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Recent Characters</h5>
                            <button class="btn btn-icon">
                                <i class="bi bi-plus-lg fw-bold"></i>
                            </button>
                        </div>
                        <div class="list-group list-group-flush">
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Adaine Amberheart
                            </li>
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Character Name
                            </li>
                            <li class="list-item p-4 fs-5 list-group-item list-group-item-action">
                                Character Name
                            </li>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
