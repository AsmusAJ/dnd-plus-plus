<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DND++ Dashboard</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>

    <body>
        <div class="bg-body min-vh-100"> <!-- makes background color-->
            <div id="header-placeholder"></div>

            <main class="container-fluid p-3 p-lg-4">
                <div class="row">

                    <div class="col-lg-4"> <!--left column, takes 4 of total columns-->

                        <div class="card bg-white mb-4">
                            <div class="card-body">
                                <img src="https://via.placeholder.com/600x520.png?text=Calendar+Placeholder"
                                    class="img-fluid" alt="Calendar Placeholder">
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Upcoming Sessions</h5>
                                <button class="btn">
                                    <i class="bi bi-plus-lg fw-bold"></i>
                                </button>
                            </div>
                            <div class="list-group list-group-flush">
                                <a
                                    class="nav-link d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action" href="#">
                                    <strong class="fs-5">Session 1</strong>
                                    <div>
                                        <span class="fs-6">2 PM</span>
                                        <small>Oct 27,</small>
                                        <small>2025</small>
                                    </div>
                                </a>
                                <a
                                    class="nav-link d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action" href="#">
                                    <strong class=" fs-5">Session 2</strong>
                                    <div>
                                        <span class="fs-6">3 PM</span>
                                        <small>Oct 31,</small>
                                        <small>2025</small>
                                    </div>
                                </a>
                            </div>
                        </div>

                    </div>

                    <div class="col-lg-8"> <!--rightcolumn, takes 8 of total columns-->

                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Recent Campaigns</h5>
                                <button class="btn">
                                    <i class="bi bi-plus-lg fw-bold"></i>
                                </button>
                            </div>
                            <div class="list-group list-group-flush">
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="campaign_page.html">
                                    <span class="fs-5">Scorn of Scolia</span>
                                    <span class="fs-6">System</span>
                                </a>
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="#">
                                    <span class="fs-5">Campaign 2</span>
                                    <span class="fs-6">System</span>
                                </a>
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="#">
                                    <span class="fs-5">Campaign 3</span>
                                    <span class="fs-6">System</span>
                                </a>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Recent Characters</h5>
                                <button class="btn">
                                    <i class="bi bi-plus-lg fw-bold"></i>
                                </button>
                            </div>
                            <div class="list-group list-group-flush">
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="#">
                                    <span class="fs-5">Adelaine Amberheart</span>
                                    <span class="fs-6">System</span>
                                </a>
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="#">
                                    <span class="fs-5">Campaign 2</span>
                                    <span class="fs-6">System</span>
                                </a>
                                <a class="nav-link d-flex justify-content-between align-items-center p-4 fs-5 list-group-item list-group-item-action" href="#">
                                    <span class="fs-5">Campaign 3</span>
                                    <span class="fs-6">System</span>
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        
        <script src="../static/js/header_script.js"></script>
    </body>

</html>
