{% extends "base.html" %}

{% block title %}DND++ Dashboard{% endblock %}

{% block content %}
<main class="container-fluid p-3 p-lg-4">
    <div class="row">
        <div class="col-lg-2"></div>
        <div class="col-lg-8">

            {% for campaign in campaigns %}
            <div class="card mb-4">
                <div class="list-group list-group-flush">
                    <a class="nav-link d-flex justify-content-between align-items-center p-4 list-group-item list-group-item-action"
                        href="{{ url_for('show_campaign', user_url_slug=session.username, campaign_id_url_slug=campaign.campaign_id) }}">
                        <strong class="fs-5">{{ campaign.page_title }}</strong>
                        <span class="fs-6">{{ campaign.system }}</span>
                    </a>
                </div>
            </div>

            {% else %}
            <div class="card mb-4">
                <div class="card-body text-center p-5">
                    <h3 class="card-title">No Campaigns Found</h3>
                    <p class="card-text">You haven't created any campaigns yet!</p>
                </div>
            </div>
            {% endfor %}

        </div>
        <div class="col-lg-2"></div>
    </div>
</main>
{% endblock %}
